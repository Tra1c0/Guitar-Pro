name: Android and portable core
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The action's default package list still names the removed 'tools' package; request only what the build needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: riffworkbench-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Tests, architecture checks and lint
        run: ./gradlew check :app:lintDebug --continue --stacktrace
      - name: Collect verification summary
        # The JSON is printed so the committed docs/VERIFICATION.json can be refreshed from a real run.
        run: python3 tools/collect_validation.py && cat build/verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            **/build/reports/
            **/build/test-results/
            build/verification.json
